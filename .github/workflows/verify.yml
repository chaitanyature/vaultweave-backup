name: Recovery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/recovery_drill.py
      - run: cd "$RUNNER_TEMP" && vaultweave --repo installed-vault init && vaultweave --repo installed-vault list
